<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to AnimePortal</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="devtools-block.js"></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-block-size:100vh;background:linear-gradient(120deg,#181a20 60%,#ff5e62 100%);">
  <div class="startup-container" style="background:rgba(35,38,58,0.85);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,0.18);padding:3rem 2.5rem 2.5rem 2.5rem;text-align:center;max-inline-size:400px;inline-size:100%;backdrop-filter:blur(8px);animation:fadeIn 1s;">
    <div class="startup-logo" style="font-size:2.5rem;font-weight:bold;color:#ff5e62;margin-block-end:1.2rem;letter-spacing:2px;text-shadow:0 2px 8px rgba(255,94,98,0.08);">AnimePortal</div>
    <div class="startup-title" style="font-size:1.7rem;font-weight:600;margin-block-end:0.7rem;">Welcome to AnimePortal</div>
    <div class="startup-desc" style="font-size:1.1rem;margin-block-end:2.2rem;color:#f3f3f3;">Your gateway to streaming anime in HD, free and always updated.<br>Click below to start browsing!</div>
    <button class="cta" onclick="window.location.href='index.html'" style="font-size:1.15rem;">Browse Anime</button>
  </div>
</body>
</html>
