<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Portal</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="devtools-block.js"></script>
  <script defer src="anime.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">AnimePortal</div>
    <ul class="nav-links">
      <li><a href="#home" class="nav-btn">Home</a></li>
      <li><a href="#trending" class="nav-btn">Trending</a></li>
      <li><a href="#recent" class="nav-btn">Recently Added</a></li>
      <li><a href="#featured" class="nav-btn">Featured</a></li>
    </ul>
    <form class="nav-search" onsubmit="return false;">
      <input type="text" placeholder="Search anime...">
      <button class="search-btn">🔍</button>
    </form>
  </nav>
  <main>
    <section class="hero">
      <h1>Welcome to <span class="accent">AnimePortal</span></h1>
      <p>Discover, search, and stream your favorite anime with a fresh, original UI.</p>
      <button class="cta" onclick="window.scrollTo({top: 600, behavior: 'smooth'})">Browse Anime</button>
    </section>
    <section class="anime-section" id="trending">
      <h2>🔥 Trending</h2>
      <div class="anime-grid trending-grid"></div>
    </section>
    <section class="anime-section" id="recent">
      <h2>🆕 Recently Added</h2>
      <div class="anime-grid recent-grid"></div>
    </section>
    <section class="anime-section" id="featured">
      <h2>🌟 Featured</h2>
      <div class="anime-grid main-grid"></div>
    </section>
  </main>
  <div id="player-modal" class="player-modal" style="display:none;">
    <div class="player-modal-bg"></div>
    <div class="player-modal-content">
      <button class="player-modal-close" aria-label="Close">&times;</button>
      <div class="player-modal-header">
        <span class="player-modal-title"></span>
        <select class="player-episode-select"></select>
      </div>
      <div class="player-modal-body">
        <video class="player-video" controls preload="metadata" style="width:100%;max-height:60vh;background:#000;">
          <source src="" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="player-modal-error" style="display:none;color:#ff5e62;margin-top:1rem;"></div>
      </div>
    </div>
  </div>
  <div class="continue-grid"></div>
  <footer class="footer">
    <span>&copy; 2026 AnimePortal. All rights reserved.</span>
  </footer>
</body>
</html>
